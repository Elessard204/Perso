# Règles appliquées à chaque bon de service. Modifiables dans l'onglet Règles.
[heures]
pas_minutes = 15                 # chaque ligne de main-d'œuvre au 0,25 h supérieur (minimum 0,25)
transport_max_minutes = 60       # au-delà, l'excédent du transport passe en main-d'œuvre
[materiel]
marge = 0.15                     # coût avant taxes + 15 %
refacturer_taxes = false
[transports]
regle = "un_par_visite"          # quantité 1 par entrée de transport
[tarifs."Appel de service"]      # service SMMP
service = "SMMP"
heure = 65.0
transport = 50.0
[tarifs."Maintenance"]           # service SELP
service = "SELP"
heure = 45.0
transport = 40.0
[tarifs."Rénovation"]            # service SRP (numéros SRP…)
service = "SRP"
heure = 85.0
transport = 50.0
[tarif_progression]              # taux que Progression met par défaut : seul celui-ci est corrigé automatiquement
type = "Appel de service"
[couts]                          # taux de base des techniciens, pour estimer la rentabilité (modifiable dans Règles)
defaut = 0.0                     # taux de base moyen si le technicien n'est pas dans la liste; 0 = inconnu
das = 0.12                       # charges de l'employeur (RRQ, AE, RQAP, FSS, CNESST...), en fraction du taux de base
vacances = 0.06                  # 6 % pour tous les employés (paie Progim)
feries = 0.05                    # 5 % (paie Progim)
[couts.techniciens]
[garde_fous]
ecart_sous_total = 0.05
jours_max_facture = 30
montant_max_ligne = 1000.00
heures_max_jour = 12
marge_minimum = 0.0              # 0 = signaler seulement les bons à perte
[kilometrage]
taux = 0.61                      # $ par km
seuil_ecart_km = 10.0            # écart déclaré / payé signalé au-delà, par technicien et par période
debut_reference = "2026-11-08"   # un dimanche : début d'une période de paie de deux semaines
