# Configuration de l'envoi mensuel des rapports clients.
# Tout ce qui change d'un mois à l'autre (clients, courriels, documents requis)
# est dans l'Excel des clients, pas ici. Ce fichier change rarement.

[envoi]
expediteur = "finance@progim.com"
# Membres de la direction en copie quand la colonne courriel_direction de
# l'Excel est vide pour un client.
direction_defaut = [
    "elessard@progim.com",
    "mpaquet@progim.com",
]
objet_fr = "Rapports financiers – {mois_texte} – {nom_client}"
objet_en = "Financial reports – {mois_texte} – {nom_client}"
signature = "L'équipe Finance – Progim"

[fichiers]
# Comment reconnaître un rapport téléchargé de Hopem par son nom de fichier.
# Format actuel : « Rapports mensuels Sept 2026_05401.pdf », où les 5 derniers
# chiffres sont le code de l'entité : 054 01 = 54.1.
motif = '^Rapports mensuels (?P<mois>\S+) (?P<annee>\d{4})_(?P<entite>\d{5})\.pdf$'
# Pièces additionnelles (factures, liste des chèques...) : tout PDF dont le nom se
# termine par le même numéro d'entité, ex. « Factures Sept 2026_14001.pdf ».
motif_annexe = '_(?P<entite>\d{5})\.pdf$'

[controles]
# Le bilan doit être « Au » dernier jour du mois envoyé.
verifier_date = true
# L'état des résultats doit porter la période calculée à partir de la fin d'exercice.
verifier_periode = true

# Ce qui peut être inclus dans l'envoi d'une entité. Chaque « cle » est une colonne
# Oui/Non de l'onglet Entites; une case vide prend la valeur « defaut ».
# « titre » : rapport reconnu par son titre dans le PDF Hopem (3e ligne de la page).
# « annexe » : fichier séparé reconnu par ces mots dans son nom, joint automatiquement.
# Les titres Hopem des rapports moins courants sont À CONFIRMER sur de vrais PDF.
[[contenu]]
cle = "bilan"
libelle = "Bilan"
titre = ["bilan"]
defaut = true

[[contenu]]
cle = "etat_resultats"
libelle = "État des résultats"
titre = ["etat des resultats"]
defaut = true

[[contenu]]
cle = "sommaire_transactions"
libelle = "Sommaire mensuel des transactions"
titre = ["sommaire mensuel des transactions", "sommaire des transactions"]
defaut = true

[[contenu]]
cle = "transactions_par_compte"
libelle = "Liste des transactions par compte"
titre = ["transactions par", "grand livre", "grand-livre"]

[[contenu]]
cle = "liste_depots"
libelle = "Liste des dépôts"
titre = ["depot"]

[[contenu]]
cle = "comptes_a_recevoir"
libelle = "Comptes à recevoir"
titre = ["comptes a recevoir", "compte a recevoir"]

# « manuel » : document joint à la main dans le brouillon; l'outil le rappelle seulement.
[[contenu]]
cle = "factures"
libelle = "Factures payées"
manuel = "joindre les factures payées au brouillon avant l'envoi"

# Rapports de fin d'exercice : PDF séparés que Sabrina ajoute au dossier du mois, en plus du PDF mensuel habituel
# (les états financiers mensuels), pour les entités dont c'est le dernier mois de l'exercice (période 12).
# Chaque fichier se termine par le numéro de l'entité, ex. « Balance de vérification Oct 2026_01002.pdf ».
# « annexe » : mots reconnus dans le nom du fichier. Un rapport absent bloque l'envoi de l'entité.
[[fin_exercice]]
libelle = "Balance de vérification"
libelle_en = "Trial balance"
annexe = ["balance de verification", "balance verification"]

[[fin_exercice]]
libelle = "Auxiliaire des comptes à payer"
libelle_en = "Accounts payable subledger"
annexe = ["a payer", "payable"]

[[fin_exercice]]
libelle = "Auxiliaire des comptes à recevoir"
libelle_en = "Accounts receivable subledger"
annexe = ["a recevoir", "recevable"]

[[fin_exercice]]
libelle = "État des frais engagés"
libelle_en = "Statement of accrued expenses"
annexe = ["frais engage"]

[[fin_exercice]]
libelle = "Grand livre"
libelle_en = "General ledger"
annexe = ["grand livre"]
