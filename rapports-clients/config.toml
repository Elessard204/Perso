# Configuration de l'envoi mensuel des rapports clients.
# Tout ce qui change d'un mois à l'autre (clients, courriels, documents requis)
# est dans l'Excel des clients, pas ici. Ce fichier change rarement.

[envoi]
expediteur = "finance@progim.com"
# Membres de la direction en copie quand la colonne courriel_direction de
# l'Excel est vide pour un client.
direction_defaut = [
    "elessard@progim.com",
    "mpaquet@progim.com",
]
objet_fr = "Rapports financiers – {mois_texte} – {nom_client}"
objet_en = "Financial reports – {mois_texte} – {nom_client}"
signature = "L'équipe Finance – Progim"

[fichiers]
# Comment reconnaître un rapport téléchargé de Hopem par son nom de fichier.
# Format actuel : « Rapports mensuels Sept 2026_05401.pdf », où les 5 derniers
# chiffres sont le code de l'entité : 054 01 = 54.1.
motif = '^Rapports mensuels (?P<mois>\S+) (?P<annee>\d{4})_(?P<entite>\d{5})\.pdf$'

[controles]
# Titres de rapports qui doivent se trouver dans chaque PDF (3e ligne de la page Hopem).
rapports_obligatoires = ["Bilan", "État des résultats"]
# Le bilan doit être « Au » dernier jour du mois envoyé.
verifier_date = true
# L'état des résultats doit porter la période calculée à partir de la fin d'exercice.
verifier_periode = true

[graph]
# Application inscrite dans Entra ID (voir README). Le secret n'est jamais
# écrit ici : il est lu dans la variable d'environnement GRAPH_CLIENT_SECRET.
tenant_id = ""
client_id = ""
